name: EASTester
options:
  bundleIdPrefix: com.eastester
  deploymentTarget:
    iOS: "17.0"
targets:
  EASTester:
    type: application
    platform: iOS
    sources:
      - ContentView.swift
      - EASEvent.swift
      - EASTesterApp.swift
      - NotificationManager.swift
      - ToneGenerator.swift
      - attention.wav
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eastester.app
        PRODUCT_NAME: EASTester
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EAS Tester
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
